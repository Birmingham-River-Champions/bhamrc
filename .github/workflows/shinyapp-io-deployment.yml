name: Deploy to shinyapps.io

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Install renv
        run: install.packages("renv")
        shell: Rscript {0}

      - name: Restore renv packages
        run: renv::restore(prompt = FALSE)
        shell: Rscript {0}

      - name: Check secrets exist
        run: |
          echo "Name length: ${#SHINYAPPS_NAME}"
          echo "Token length: ${#SHINYAPPS_TOKEN}"
          echo "Secret length: ${#SHINYAPPS_SECRET}"
        env:
          SHINYAPPS_NAME: ${{ secrets.MAIN_SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.MAIN_SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.MAIN_SHINYAPPS_SECRET }}

      - name: Install rsconnect requirements
        run: install.packages(c("rsconnect", "desc"))
        shell: Rscript {0}

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.MAIN_SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.MAIN_SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.MAIN_SHINYAPPS_SECRET }}
        run: |
          rsconnect::setAccountInfo(
            name = Sys.getenv("SHINYAPPS_NAME"),
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

          rsconnect::deployApp(
            appName = desc::desc_get_field("Package"),
            appTitle = desc::desc_get_field("Package"),
            appFiles = c(
              "R/",
              "inst/",
              "NAMESPACE",
              "DESCRIPTION",
              "app.R"
            ),
            lint = FALSE,
            forceUpdate = TRUE
          )
        shell: Rscript {0}